[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collector-rba-au"
version = "0.1.0"
description = "Collects selected official RBA monetary and exchange-rate series for Australian inflation research"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Macrobond Inhouse" }]
dependencies = [
  "azure-identity>=1.12",
  "azure-keyvault-secrets>=4.4",
  "databricks-sqlalchemy>=0.2.8",
  "psycopg2-binary>=2.9",
  "pyspark==4.1.1",
  "httpx[socks]>=0.27",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
]
[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6", "types-openpyxl"]

[tool.setuptools]
# Without an explicit declaration setuptools auto-discovery maps only a
# non-existent "main" package, so `pip install -e .` leaves `scripts`
# uninstalled and a clean-room `pytest` cannot import it.
packages = ["scripts"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep a bare `pytest` working: conftest.py lives in tests/, so pytest prepends
# tests/ rather than the repository root.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "scripts", "tests"]
explicit_package_bases = true
mypy_path = "."
no_implicit_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.databricks_engine"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]


[tool.ruff.lint.per-file-ignores]
"scripts/databricks_engine.py" = ["BLE001", "RUF100", "S110"]
